<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; cursor: crosshair; user-select: none; font-family: "Segoe UI", system-ui, sans-serif; background: transparent; }
  #shade { position: fixed; inset: 0; }
  #sel { position: fixed; border: 2px solid #2dd4bf; box-shadow: 0 0 0 9999px rgba(8, 12, 18, .55); display: none; cursor: move; box-sizing: border-box; }
  #sel .h { position: absolute; width: 12px; height: 12px; background: #2dd4bf; border: 2px solid #fff; border-radius: 50%; box-sizing: border-box; }
  .nw{left:-7px;top:-7px;cursor:nwse-resize}.ne{right:-7px;top:-7px;cursor:nesw-resize}.sw{left:-7px;bottom:-7px;cursor:nesw-resize}.se{right:-7px;bottom:-7px;cursor:nwse-resize}
  .n{left:calc(50% - 6px);top:-7px;cursor:ns-resize}.s{left:calc(50% - 6px);bottom:-7px;cursor:ns-resize}.w{left:-7px;top:calc(50% - 6px);cursor:ew-resize}.e{right:-7px;top:calc(50% - 6px);cursor:ew-resize}
  #size { position: fixed; background: #0f1720; color: #fff; font-size: 12px; padding: 3px 8px; border-radius: 6px; display: none; pointer-events: none; }
  #bar { position: fixed; display: none; gap: 8px; }
  #bar button { font: 600 13px "Segoe UI", system-ui, sans-serif; border: 0; border-radius: 8px; padding: 9px 14px; cursor: pointer; }
  .ok { background: #ef4444; color: #fff; } .cancel { background: #e5e7eb; color: #111; }
  #hint { position: fixed; top: 24px; left: 50%; transform: translateX(-50%); background: rgba(15,23,32,.9); color: #fff; padding: 10px 18px; border-radius: 10px; font-size: 14px; pointer-events: none; }
  #full { position: fixed; inset: 0; background: rgba(8,12,18,.35); }
</style>
</head>
<body>
<div id="full"></div>
<div id="hint">Drag to select an area · Enter to confirm · Esc to cancel</div>
<div id="sel"><span class="h nw" data-h="nw"></span><span class="h ne" data-h="ne"></span><span class="h sw" data-h="sw"></span><span class="h se" data-h="se"></span><span class="h n" data-h="n"></span><span class="h s" data-h="s"></span><span class="h w" data-h="w"></span><span class="h e" data-h="e"></span></div>
<div id="size"></div>
<div id="bar"><button class="cancel" id="cancel">Cancel</button><button class="ok" id="ok">Use this area</button></div>
<script>
  const sel = document.getElementById('sel'), size = document.getElementById('size'), bar = document.getElementById('bar'), full = document.getElementById('full');
  let r = null, mode = null, start = null, orig = null;
  const W = () => window.innerWidth, H = () => window.innerHeight;
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  function draw() {
    if (!r || r.w < 2 || r.h < 2) { sel.style.display = 'none'; size.style.display = 'none'; bar.style.display = 'none'; full.style.display = 'block'; return; }
    full.style.display = 'none';
    Object.assign(sel.style, { display: 'block', left: r.x + 'px', top: r.y + 'px', width: r.w + 'px', height: r.h + 'px' });
    size.textContent = `${Math.round(r.w * devicePixelRatio)} × ${Math.round(r.h * devicePixelRatio)}`;
    Object.assign(size.style, { display: 'block', left: r.x + 'px', top: Math.max(0, r.y - 26) + 'px' });
    const by = r.y + r.h + 10 + 44 > H() ? r.y + r.h - 54 : r.y + r.h + 10;
    Object.assign(bar.style, { display: mode ? 'none' : 'flex', left: clamp(r.x + r.w - 230, 8, W() - 240) + 'px', top: by + 'px' });
  }

  const params = new URLSearchParams(location.search);
  if (params.get('preset')) { try { r = JSON.parse(params.get('preset')); } catch {} }
  draw();

  document.addEventListener('mousedown', (e) => {
    if (e.target.closest('#bar')) return;
    start = { x: e.clientX, y: e.clientY };
    orig = r ? { ...r } : null;
    if (e.target.dataset.h) mode = e.target.dataset.h;
    else if (e.target === sel) mode = 'move';
    else { mode = 'new'; r = { x: e.clientX, y: e.clientY, w: 0, h: 0 }; }
    draw();
  });
  document.addEventListener('mousemove', (e) => {
    if (!mode) return;
    const dx = e.clientX - start.x, dy = e.clientY - start.y;
    if (mode === 'new') {
      r = { x: Math.min(start.x, e.clientX), y: Math.min(start.y, e.clientY), w: Math.abs(dx), h: Math.abs(dy) };
    } else if (mode === 'move') {
      r = { ...orig, x: clamp(orig.x + dx, 0, W() - orig.w), y: clamp(orig.y + dy, 0, H() - orig.h) };
    } else {
      let { x, y, w, h } = orig;
      if (mode.includes('w')) { x = orig.x + dx; w = orig.w - dx; }
      if (mode.includes('e')) { w = orig.w + dx; }
      if (mode.includes('n')) { y = orig.y + dy; h = orig.h - dy; }
      if (mode.includes('s')) { h = orig.h + dy; }
      if (w < 0) { x += w; w = -w; } if (h < 0) { y += h; h = -h; }
      r = { x, y, w, h };
    }
    draw();
  });
  document.addEventListener('mouseup', () => { mode = null; draw(); });
  document.addEventListener('dblclick', (e) => { if (e.target === sel) confirm(); });

  function confirm() {
    if (!r || r.w < 16 || r.h < 16) return;
    // keep even pixel sizes for encoders
    window.swt.regionResult({ x: Math.round(r.x), y: Math.round(r.y), w: Math.round(r.w), h: Math.round(r.h) });
  }
  document.getElementById('ok').onclick = confirm;
  document.getElementById('cancel').onclick = () => window.swt.regionResult(null);
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') window.swt.regionResult(null);
    if (e.key === 'Enter') confirm();
  });
</script>
</body>
</html>
